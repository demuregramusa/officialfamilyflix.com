kind = "web"
previewPath = "/familyflix/"
title = "FamilyFlix"
description = "A family-friendly streaming catalog for rights-reviewed public-domain and properly licensed titles, with playable media and a copyright review center."
version = "1.0.0"
id = "artifacts/familyflix"
router = "path"

[[services]]
name = "web"
paths = ["/familyflix/"]
localPort = 23453

[services.development]
run = "pnpm --filter @workspace/familyflix run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/familyflix", "run", "build"]
serve = "static"
publicDir = "artifacts/familyflix/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23453"
BASE_PATH = "/familyflix/"
