# ==============================================================================
# FAMILYFLIX BY DEMUREGRAM — PRODUCTION NGINX VIRTUAL HOST CONFIGURATION
# File: /etc/nginx/conf.d/officialfamilyflix.com.conf
# ==============================================================================

# Global HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name officialfamilyflix.com *.officialfamilyflix.com;
    
    # Let's Encrypt ACME challenge endpoint
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 1. www -> non-www Canonical Redirect
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    return 301 https://officialfamilyflix.com$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Main Streaming Platform: officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    root /var/www/familyflix/dist/public;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Immutable hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA Client-Side Routing fallback
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }
}

# ------------------------------------------------------------------------------
# 3. Public & Internal API: api.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ------------------------------------------------------------------------------
# 4. Private Administration: admin.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    # Network-level access restriction (Owner Management Subnet / VPN)
    # Uncomment and specify authorized management IPs:
    # allow 192.168.1.0/24;
    # allow 10.8.0.0/24;   # WireGuard / OpenVPN subnet
    # allow 127.0.0.1;
    # deny all;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 5. Developer Portal: developers.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name developers.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    root /var/www/familyflix/dist/public;

    location / {
        limit_req zone=general_limit burst=30 nodelay;
        # Rewrite to the SPA developers route
        try_files $uri $uri/ /index.html;
    }

    location /api/dev/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 6. Authentication Gateway: auth.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    location / {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 7. Media Delivery CDN: cdn.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    root /var/media/familyflix/hls;

    # CORS Headers for Video Players (Shaka, HLS.js, Video.js)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # Fast binary transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # HLS Master Playlists & Variant Playlists (.m3u8)
    location ~* \.m3u8$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            application/vnd.apple.mpegurl m3u8;
        }
    }

    # HLS Video Segments (.ts)
    location ~* \.ts$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            video/mp2t ts;
        }
    }

    # Subtitles & Captions (.vtt, .srt)
    location ~* \.(vtt|srt)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            text/vtt vtt;
            text/plain srt;
        }
    }
}

# ------------------------------------------------------------------------------
# 8. Poster and Image Delivery: images.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name images.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    root /var/media/familyflix/images;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=2592000, immutable";

    location ~* \.(webp|avif|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }
}

# ------------------------------------------------------------------------------
# 9. Service Availability & Status: status.officialfamilyflix.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.officialfamilyflix.com;

    ssl_certificate /etc/letsencrypt/live/officialfamilyflix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officialfamilyflix.com/privkey.pem;

    # Proxied to Uptime Kuma (port 3001) or backend health status
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
