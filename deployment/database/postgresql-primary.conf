# ==============================================================================
# FAMILYFLIX BY DEMUREGRAM — POSTGRESQL PRIMARY CONFIGURATION
# File: /etc/postgresql/16/main/conf.d/replication.conf
# ==============================================================================

# Network & Connectivity
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Tuning (Sized for 32GB RAM Host)
shared_buffers = 8GB
effective_cache_size = 24GB
maintenance_work_mem = 2GB
work_mem = 32MB
wal_buffers = 64MB

# Checkpoints & Disk Writes
min_wal_size = 2GB
max_wal_size = 16GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Replication & WAL Settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 4096MB
hot_standby = on

# WAL Archiving
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# SSL & Security
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
