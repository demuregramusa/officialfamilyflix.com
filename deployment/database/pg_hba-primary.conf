# ==============================================================================
# FAMILYFLIX BY DEMUREGRAM — POSTGRESQL HBA ACCESS RULES
# File: /etc/postgresql/16/main/pg_hba.conf additions
# ==============================================================================

# Local Unix Socket Access
local   all             postgres                                peer
local   all             familyflix                              peer

# Localhost Application Connection
host    familyflix      familyflix      127.0.0.1/32            scram-sha-256
host    familyflix      familyflix      ::1/128                 scram-sha-256

# Streaming Replication connection from Secondary Server (Node 2)
# Replace 192.168.1.102 with Secondary Server Private IP
host    replication     replicator      192.168.1.102/32        scram-sha-256
host    replication     replicator      203.0.113.10/32         scram-sha-256
