name: FamilyFlix Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Types (Monorepo Typecheck)
        run: pnpm run typecheck

      - name: Production Build (Frontend SPA & API Server)
        run: pnpm run build

      - name: Deploy to Railway (Production Release)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.RAILWAY_TOKEN != ''
        run: |
          npm i -g @railway/cli
          railway up --ci -m "Production release from commit ${{ github.sha }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
